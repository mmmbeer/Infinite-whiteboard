<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2e3532" />
  <title>Infinite Whiteboard</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/canvas.css" />
  <link rel="stylesheet" href="./css/ui.css" />
</head>
<body>
  <svg class="icon-defs" aria-hidden="true">
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></symbol>
    <symbol id="icon-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m4-5h-8a6 6 0 0 0-6 6"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-arrange" viewBox="0 0 24 24"><path d="M4 5h16M7 9h10M5 13h14M8 17h8M4 21h16"/></symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4V4Z"/></symbol>
    <symbol id="icon-boards" viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="14"/><path d="M7 1h14v14M7 8h6M7 12h6"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 14v6h16v-6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.5 2.1c-.8.5-1.3.9-1.3 1.9M12 17h.01"/></symbol>
    <symbol id="icon-export" viewBox="0 0 24 24"><path d="M12 3v13m0 0 5-5m-5 5-5-5M4 15v6h16v-6"/></symbol>
  </svg>
  <main id="app" aria-label="Infinite Whiteboard application">
    <header class="topbar">
      <div class="brand" aria-label="Infinite Whiteboard">
        <img class="brand-mark" src="./assets/logo-mark.svg" alt="" />
        <span>Infinite Whiteboard</span>
      </div>
      <div class="board-title-wrap">
        <input id="board-title" class="board-title" value="Untitled board" aria-label="Board title" />
        <span id="save-status" class="save-status">Saved locally</span>
      </div>
      <nav class="top-actions" aria-label="Board actions">
        <button class="button icon-button" id="undo-btn" data-tooltip="Undo (Ctrl+Z)" aria-label="Undo"><svg><use href="#icon-undo"/></svg></button>
        <button class="button icon-button" id="redo-btn" data-tooltip="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg><use href="#icon-redo"/></svg></button>
        <button class="button icon-button" id="search-btn" data-tooltip="Find on board (Ctrl+K)" aria-label="Find on board"><svg><use href="#icon-search"/></svg></button>
        <button class="button icon-button" id="arrange-btn" data-tooltip="Arrange selected items" aria-label="Arrange selected items"><svg><use href="#icon-arrange"/></svg></button>
        <button class="button icon-button" id="layers-btn" data-tooltip="Layers, visibility, and locks (L)" aria-label="Open layers"><svg><use href="#icon-layers"/></svg></button>
        <button class="button icon-button" id="bookmarks-btn" data-tooltip="Navigation bookmarks (B)" aria-label="Open navigation bookmarks"><svg><use href="#icon-bookmark"/></svg></button>
        <button class="button icon-button" id="boards-btn" data-tooltip="Boards, restore, and history" aria-label="Open boards"><svg><use href="#icon-boards"/></svg></button>
        <button class="button icon-button" id="import-btn" data-tooltip="Upload assets (U)" aria-label="Upload assets"><svg><use href="#icon-upload"/></svg></button>
        <button class="button icon-button" id="settings-btn" data-tooltip="Board settings (S)" aria-label="Open board settings"><svg><use href="#icon-settings"/></svg></button>
        <button class="button icon-button" id="shortcuts-btn" data-tooltip="Keyboard and touch controls (?)" aria-label="Keyboard and touch controls"><svg><use href="#icon-help"/></svg></button>
        <button class="button icon-button primary" id="export-btn" data-tooltip="Export board ZIP (E)" aria-label="Export board ZIP"><svg><use href="#icon-export"/></svg></button>
      </nav>
    </header>

    <aside class="tool-rail" aria-label="Canvas tools">
      <button class="tool active" data-tool="select" title="Select (V)"><span>↖</span><small>Select</small></button>
      <button class="tool" data-tool="multi" title="Multi-select (M)"><span>☑</span><small>Multi</small></button>
      <button class="tool" data-tool="hand" title="Pan (H)"><span>✥</span><small>Pan</small></button>
      <button class="tool" data-tool="connect" title="Connect (C)"><span>⌁</span><small>Connect</small></button>
      <button class="tool" data-tool="group" title="Create frame from selection (G)"><span>▣</span><small>Frame</small></button>
      <button class="tool" data-tool="axis" title="Add time axis (A)"><span>⇥</span><small>Axis</small></button>
      <button class="tool" data-tool="capture" title="Capture area (P)"><span>⌗</span><small>Capture</small></button>
    </aside>

    <section id="viewport" class="viewport" tabindex="0" aria-label="Whiteboard canvas">
      <div id="drop-hint" class="drop-hint">Drop images, text, or Markdown exactly where you want them</div>
      <div id="world" class="world">
        <div id="grid" class="grid"></div>
        <div id="axes-layer" class="axes-layer"></div>
        <div id="groups-layer" class="groups-layer"></div>
        <div id="guides-layer" class="guides-layer"></div>
        <svg id="edges-layer" class="edges-layer" overflow="visible" aria-hidden="true"></svg>
        <div id="nodes-layer" class="nodes-layer"></div>
      </div>
      <div id="selection-box" class="selection-box hidden"></div>
      <div id="capture-box" class="capture-box hidden"><span>Release to capture</span></div>
      <button id="create-fab" class="create-fab" aria-label="Create new item" title="Create new (N)">+</button>
      <div class="zoom-controls">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-reset" aria-label="Reset zoom"><span id="zoom-value">100%</span></button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-fit" aria-label="Fit board">Fit</button>
        <button id="zoom-selection" aria-label="Zoom to selection" title="Zoom to selection (2)">Sel</button>
      </div>
      <div class="minimap" id="minimap" aria-hidden="true"><div id="minimap-window"></div></div>
    </section>

    <aside id="inspector" class="inspector" aria-label="Inspector">
      <div class="inspector-empty">
        <span>◫</span>
        <h2>Nothing selected</h2>
        <p>Select an item to edit its description, categories, tags, and grouping.</p>
      </div>
    </aside>

    <input id="file-input" type="file" accept="image/*,.txt,.md,.markdown,text/plain,text/markdown" multiple hidden />
    <input id="board-file-input" type="file" accept=".zip,.json,application/zip,application/json" hidden />
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
